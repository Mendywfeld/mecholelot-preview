<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08120f">
<title>See you soon</title>
<meta property="og:title" content="See you soon">
<meta property="og:description" content="להתראות בקרוב">
<meta property="og:image" content="https://see-you-soon-770.vercel.app/family.jpeg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Frank+Ruhl+Libre:wght@300;400;500&family=Secular+One&display=swap">
<link rel="preload" href="loop.mp3" as="audio">
<style>
:root{--ground:#070c07;--night:#22406e;--dusk:#162a4a;--ink:#f6efe2;--mute:rgba(246,239,226,.72);--line:rgba(246,239,226,.42);--display:"Cormorant Garamond",Georgia,"Times New Roman",serif;--hebrew:"Frank Ruhl Libre","David","Times New Roman",serif;--cta:"Secular One","Rubik","Arial Hebrew",Arial,sans-serif;--sky-h:190svh;--ph:max(58svh,calc(100vw / 2.59 * .85));color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);overflow:hidden}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:none}
#scroller::-webkit-scrollbar{display:none}
section{position:relative;width:100%;overflow:hidden}
.arrival{height:100svh;background:linear-gradient(to bottom,rgba(13,26,46,.5) 0%,rgba(22,42,74,.35) 55%,var(--night) 100%),url("sky.png") center top / cover no-repeat,var(--dusk)}
.photo{position:absolute;top:0;left:0;width:100%;height:var(--ph);overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 58%,rgba(0,0,0,.55) 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 58%,rgba(0,0,0,.55) 80%,transparent 100%)}
.photo img{display:block;width:100%;height:calc(var(--ph) / .85);object-fit:cover;object-position:47.5% 0;filter:saturate(.9) brightness(.94)}
.photo::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(to bottom,rgba(22,42,74,0),rgba(22,42,74,.55));pointer-events:none}
.farewell{position:absolute;left:0;right:0;top:calc(var(--ph) - 3svh);bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1rem calc(4.5rem + env(safe-area-inset-bottom,0px))}
.farewell h1{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(2.6rem,11vw,6rem);line-height:1;letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.farewell p{margin:0;font-family:var(--hebrew);font-size:clamp(1.05rem,4.4vw,1.5rem);color:var(--mute);direction:rtl}
.sky{height:var(--sky-h);background:url("sky.png") center bottom / cover no-repeat,var(--night)}
.sky::before{content:"";position:absolute;inset:0 0 auto;height:26svh;background:linear-gradient(to bottom,var(--night),rgba(34,64,110,0));pointer-events:none}
.sky::after{content:"";position:absolute;inset:auto 0 0;height:18svh;background:linear-gradient(to bottom,rgba(7,12,7,0),var(--ground));pointer-events:none}
.plane{position:absolute;left:0;top:0;width:min(92vw,760px);will-change:transform;filter:drop-shadow(0 18px 24px rgba(0,0,0,.35));z-index:2;pointer-events:none}
.ground{height:100svh;background:var(--ground)}
.family{position:absolute;left:0;bottom:0;width:100%;height:min(80vw,80svh);overflow:hidden}
.family img{width:100%;height:100%;display:block;object-fit:cover;object-position:52% 100%;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);transform-origin:50% 100%;animation:arrive 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}

/* Begin: a thin ring with a fine play mark, label beneath */
#begin{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1rem;padding-top:calc(20svh + env(safe-area-inset-top,0px));background:transparent;border:0;cursor:pointer;color:var(--ink);font:inherit;transition:opacity .9s ease}
#begin.gone{opacity:0;pointer-events:none}
.orb{position:relative;width:76px;height:76px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(circle,rgba(246,239,226,.07),rgba(246,239,226,0) 70%);transition:transform .4s ease,border-color .4s ease}
.orb::before,.orb::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(246,239,226,.35);animation:halo 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.orb::after{animation-delay:1.6s}
.orb svg{width:22px;height:22px;margin-left:4px}
@keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.cue{direction:rtl;font:400 clamp(1.25rem,5.4vw,1.5rem)/1 var(--cta);letter-spacing:.03em;color:var(--ink);text-shadow:0 2px 16px rgba(0,0,0,.45)}
#begin:hover .orb{transform:scale(1.05);border-color:rgba(246,239,226,.7)}
#begin:focus-visible .orb{outline:1px solid var(--ink);outline-offset:6px}

/* Replay: a quiet text link with a fine circular arrow */
#replay{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:.55rem;direction:rtl;background:none;border:0;border-bottom:1px solid var(--line);padding:.35rem .1rem;color:var(--ink);font:400 clamp(1.1rem,4.6vw,1.25rem)/1 var(--cta);letter-spacing:.03em;cursor:pointer;opacity:.88;animation:rise .9s ease both;transition:opacity .3s,border-color .3s}
#replay svg{width:15px;height:15px}
#replay:hover{opacity:1;border-color:var(--ink)}
#replay:focus-visible{outline:1px solid var(--ink);outline-offset:6px}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:.88;transform:translate(-50%,0)}}

#sound{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid rgba(246,239,226,.28);background:rgba(10,20,36,.28);color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.85}
#sound svg{width:17px;height:17px}
#sound:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.family img,.orb::before,.orb::after,#replay{animation:none}}
</style>
</head>
<body>
<div id="scroller" aria-label="See you soon">
  <section class="arrival" id="arrival">
    <div class="photo"><img src="shluchim.png" alt="התמונה הקבוצתית של שלוחי חב״ד מול בניין 770 בניו יורק. צילום: ישראל טייטלבאום, Chabad.org" decoding="async"></div>
    <div class="farewell">
      <h1>See you soon.</h1>
      <p>להתראות בקרוב</p>
    </div>
  </section>
  <section class="sky" id="sky">
    <img class="plane" id="plane" src="plane-branded.png" alt="" decoding="async">
  </section>
  <section class="ground" id="ground">
    <div class="family"><img src="family.jpeg" alt="המשפחה מנופפת לשלום" fetchpriority="high"></div>
  </section>
</div>
<button id="replay" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.2h3.2"/></svg>לצפות שוב</button>
<button id="begin" type="button" aria-label="תלחץ כאן לפתיחה, עם מוזיקה"><span class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M7 4.5v15L19.5 12z"/></svg></span><span class="cue">תלחץ כאן</span></button>
<button id="sound" type="button" aria-label="השתקה" hidden>
  <svg id="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
  <svg id="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
</button>
<audio id="music" src="loop.mp3" loop preload="auto"></audio>
<script>
(() => {
  const sc = document.getElementById('scroller');
  const sky = document.getElementById('sky');
  const plane = document.getElementById('plane');
  const replay = document.getElementById('replay');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOLD = 1200;
  const DURATION = 21000;
  let raf = 0, t0 = 0, auto = false;
  const maxScroll = () => sc.scrollHeight - sc.clientHeight;
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  function placePlane(){
    const vh = sc.clientHeight, vw = sc.clientWidth;
    const skyTop = sky.offsetTop, skyH = sky.offsetHeight;
    let p = (skyTop + skyH - sc.scrollTop) / (skyH + vh);
    p = Math.min(1, Math.max(0, p));
    const pw = plane.offsetWidth || vw * .9;
    const x = -pw * .95 + (vw + pw * 1.5) * p;
    const y = skyH * (0.74 - 0.46 * p) - pw * 0.16;
    const r = -8 + 4 * p;
    plane.style.transform = `translate3d(${x}px,${y}px,0) rotate(${r}deg)`;
  }
  function frame(now){
    const t = Math.min(1, (now - t0) / DURATION);
    sc.scrollTop = maxScroll() * (1 - ease(t));
    if (t < 1 && auto) raf = requestAnimationFrame(frame);
    else { auto = false; replay.hidden = false; }
  }
  function start(){
    cancelAnimationFrame(raf);
    replay.hidden = true;
    t0 = 0;
    sc.scrollTop = maxScroll();
    placePlane();
    if (reduce) return;
    auto = true;
    setTimeout(() => { if (!auto) return; t0 = performance.now(); raf = requestAnimationFrame(frame); }, HOLD);
  }
  function stopAuto(){
    if (!auto) return;
    auto = false; cancelAnimationFrame(raf);
    replay.hidden = false;
  }
  sc.addEventListener('scroll', placePlane, {passive:true});
  ['wheel','touchstart','keydown','mousedown'].forEach(ev => sc.addEventListener(ev, stopAuto, {passive:true}));
  replay.addEventListener('click', start);
  addEventListener('resize', placePlane);
  const begin = document.getElementById('begin');
  const sound = document.getElementById('sound');
  const music = document.getElementById('music');
  const icoOn = document.getElementById('ico-on'), icoOff = document.getElementById('ico-off');
  const anchor = () => { if (!auto) { sc.scrollTop = maxScroll(); placePlane(); } };
  anchor();
  addEventListener('load', anchor);
  document.querySelectorAll('img').forEach(i => i.addEventListener('load', () => { if (!t0) anchor(); }));
  function fadeIn(){
    music.volume = 0;
    const s = performance.now();
    const step = n => { const v = Math.min(1, (n - s) / 2500); music.volume = v; if (v < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  begin.addEventListener('click', () => {
    begin.classList.add('gone');
    setTimeout(() => { begin.hidden = true; }, 950);
    const p = music.play();
    if (p && p.then) p.then(() => { sound.hidden = false; fadeIn(); }).catch(() => {});
    start();
  }, {once:true});
  sound.addEventListener('click', () => {
    music.muted = !music.muted;
    icoOn.hidden = music.muted; icoOff.hidden = !music.muted;
    sound.setAttribute('aria-label', music.muted ? 'הפעלת צליל' : 'השתקה');
  });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
